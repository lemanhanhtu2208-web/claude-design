name: Deploy Trình Cà Phê to GitHub Pages

on:
  push:
    branches: ["claude/quirky-mayer-8FQCU"]
    paths:
      - "trinh-dark/**"
      - "trinh-ca-phe/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site (dark = main, light = /classic)
        run: |
          mkdir -p _site
          cp -r trinh-dark/* _site/
          mkdir -p _site/classic
          cp -r trinh-ca-phe/* _site/classic/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
