<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" role="img" aria-label="Trình Cà Phê">
  <g fill="#29ABE2">

    <!-- Cánh xoè lên trên (smooth leaf shape, không có feather phức tạp) -->
    <path d="M 186 200
             C 172 162, 186 114, 224 82
             C 262 50, 308 46, 340 68
             C 320 90, 296 114, 284 142
             C 269 172, 252 188, 218 195
             Z"/>

    <!-- Thân tròn bên dưới cánh -->
    <ellipse cx="228" cy="213" rx="54" ry="23" transform="rotate(-12 228 213)"/>

    <!-- Đầu tròn -->
    <circle cx="278" cy="191" r="22"/>

    <!-- Mỏ hướng phải -->
    <path d="M 297 184 L 326 180 L 300 200 Z"/>

    <!-- Mắt trắng -->
    <circle cx="285" cy="186" r="4.5" fill="white"/>

    <!-- Đuôi chẻ nhỏ bên trái -->
    <path d="M 175 220
             C 154 218, 132 215, 118 231
             C 138 218, 160 222, 173 219
             C 154 231, 132 237, 120 255
             C 141 242, 162 237, 175 230
             Z"/>

  </g>

  <!-- TRÌNH -->
  <text x="230" y="370" text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Inter, sans-serif"
        font-weight="900" font-size="92" letter-spacing="2"
        fill="#29ABE2">TRÌNH</text>

  <!-- Hai đường kẻ ngắn (không đè lên chữ) + CÀ PHÊ -->
  <line x1="98"  y1="404" x2="140" y2="404" stroke="#29ABE2" stroke-width="2.5"/>
  <line x1="320" y1="404" x2="362" y2="404" stroke="#29ABE2" stroke-width="2.5"/>
  <text x="230" y="412" text-anchor="middle"
        font-family="'Helvetica Neue', Inter, Arial, sans-serif"
        font-weight="600" font-size="26" letter-spacing="8"
        fill="#29ABE2">CÀ PHÊ</text>
</svg>
