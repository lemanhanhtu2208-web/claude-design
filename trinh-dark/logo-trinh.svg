<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" role="img" aria-label="Trình Cà Phê">
  <g fill="#29ABE2">

    <!-- Cánh xoè lên trên (đặc trưng logo Trình) -->
    <path d="M 162 198
             C 154 170, 162 136, 186 106
             C 210 76, 245 58, 284 50
             C 307 42, 333 46, 352 62
             C 328 73, 302 88, 284 110
             C 310 88, 337 82, 355 97
             C 330 115, 303 131, 283 153
             C 306 136, 329 134, 343 150
             C 319 167, 292 178, 271 188
             C 244 193, 207 196, 176 196
             Z"/>

    <!-- Thân tròn, hướng phải -->
    <path d="M 176 196
             C 155 198, 138 208, 140 225
             C 142 238, 162 244, 186 237
             C 210 230, 230 215, 248 204
             C 266 193, 277 184, 273 177
             C 250 177, 214 183, 192 191
             Z"/>

    <!-- Đầu tròn -->
    <circle cx="266" cy="171" r="24"/>

    <!-- Mỏ nhọn hướng phải -->
    <path d="M 287 164 L 322 160 L 290 182 Z"/>

    <!-- Mắt trắng -->
    <circle cx="274" cy="165" r="5" fill="white"/>

    <!-- Đuôi chẻ 3 nhánh về trái -->
    <path d="M 140 225
             C 120 223, 97 221, 82 238
             C 102 226, 125 230, 139 226
             C 119 238, 97 244, 84 263
             C 104 250, 128 244, 142 237
             C 124 251, 110 268, 108 288
             C 124 271, 142 255, 150 241
             Z"/>
  </g>

  <!-- TRÌNH -->
  <text x="230" y="370" text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Inter, sans-serif"
        font-weight="900" font-size="92" letter-spacing="2" fill="#29ABE2">TRÌNH</text>

  <!-- CÀ PHÊ + hai đường kẻ -->
  <line x1="150" y1="404" x2="186" y2="404" stroke="#29ABE2" stroke-width="3"/>
  <line x1="274" y1="404" x2="310" y2="404" stroke="#29ABE2" stroke-width="3"/>
  <text x="230" y="412" text-anchor="middle"
        font-family="'Helvetica Neue', Inter, Arial, sans-serif"
        font-weight="600" font-size="26" letter-spacing="8" fill="#29ABE2">CÀ PHÊ</text>
</svg>
